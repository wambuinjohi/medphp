services:
  - type: web
    name: medical-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_EXTERNAL_API_URL
        value: https://med.layonsconstruction.com/api.php
    staticPublishPath: dist
    autoDeploy: false
